name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Node 24 matches the repo's documented requirement (>= 24)
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Build contract + api (tsc)
        run: npm run build
      - name: Typecheck api / ui / cli
        run: |
          npm run typecheck -w api
          npm run typecheck -w ui
          npm run typecheck -w mn-amm-cli
      - name: Build UI (tsc + vite)
        run: npm run build -w ui
      - name: Api unit tests
        run: npm test -w api
      # Contract circuit tests use local proving only — no proof server,
      # no localnet, no network.
      - name: Contract circuit tests
        run: npm test -w contract
